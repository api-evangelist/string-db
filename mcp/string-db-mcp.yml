tools_count: 17
tools:
- name: string_resolve_proteins
  description: 'Maps one or more protein identifiers to their corresponding STRING metadata, including:

    gene symbol, description, sequence, domains, species, and internal STRING ID.


    This method is useful for translating raw identifiers into readable, annotated protein entries.


    Example input: "TP53%0dSMO"'
- name: string_interactions_query_set
  description: "Retrieves the interactions between the query proteins.\nUse this method only when you\
    \ specifically need to list the interactions between all proteins in your query set.\n\n- For a **single\
    \ protein**, the network includes that protein and its top 10 most likely interaction partners, plus\
    \ all interactions among those partners.\n- For **multiple proteins**, the network includes all direct\
    \ interactions between them.\n- STRING does not store or report information about self-interactions/homomers;\
    \ if asked, explain the limitation.\n\nIf few or no interactions are returned, consider reducing the\
    \ `required_score`.\n\nFor large query sets (>50 proteins), consider increasing the `required_score`\
    \ (e.g. ≥700) \nto focus on high-confidence interactions and avoid overly dense networks.\n\n- Expand\
    \ the names of score sources:  \n    `nscore` (neighborhood), `fscore` (fusion), `pscore` (phylogenetic\
    \ profile),  \n    `ascore` (coexpression), `escore` (experimental), `dscore` (database), `tscore`\
    \ (text-mining)"
- name: string_all_interaction_partners
  description: "Retrieves all interaction partners for one or more proteins from STRING.\n\nThis tool\
    \ returns all known interactions between your query protein(s) and **any other proteins in the STRING\
    \ database**.\n\n- Use this when asking **“What does TP53 interact with?”**\n- It differs from `string_interactions_query_set`,\
    \ which only shows interactions **within the input set** or a limited extension of it.\n\nYou can\
    \ filter for strong interactions using `required_score`.\n\n- Evidence scores:  \n    `nscore` (neighborhood),\
    \ `fscore` (fusion), `pscore` (phylogenetic profile),  \n    `ascore` (coexpression), `escore` (experimental),\
    \ `dscore` (database), `tscore` (text mining)"
- name: string_visual_network
  description: 'Retrieves a URL to a **STRING interaction network image** for one or more proteins.


    - For a single protein: includes the protein and its top 10 most likely interactors.

    - For multiple proteins: includes all known interactions **within the query set**.


    The input may include one numeric value per protein, such as fold change, effect size, or score.

    These values are visualized as colored halos around the nodes, allowing overlay of protein-level measurements
    on the network.


    Example:

    PTEN 2.1

    SMO -1.3


    If numeric values are provided:

    - positive values are shown in blue

    - negative values are shown in red

    - larger absolute values produce stronger halo intensity


    If the user provides numeric values together with the proteins, preserve them in the query.


    If few or no interactions are shown, consider lowering `required_score`.


    For large queries (>100 proteins):

    - use `network_flavor="confidence"`

    - increase `required_score` (e.g. 700)


    Always ask if the user also wants a link to the interactive STRING network page.


    Input parameters should match those used in related STRING tools (e.g. `string_interactions_query_set`),
    unless otherwise specified.'
- name: string_network_clustering
  description: "Performs **network clustering** on a STRING interaction network and returns a network\
    \ image URL,\nan interactive STRING network URL, and details about each detected cluster.\n\nProvide\
    \ a table with each detected cluster’s color, STRING-derived functional description, and any returned\
    \ features that distinguish it from the others.\n\nUse the same parameters as in the network creation\
    \ step to ensure consistency.\nIf the network already contains disconnected subgraphs, the resulting\
    \ number of clusters may differ from the requested value.\n\nInter-cluster edges are faded by default.\
    \ Use `inter_cluster_edge_visibility` to select a different display style.\n\nNotes:\n  - For small\
    \ queries (≤5 proteins), the `required_score` parameter is automatically lowered to 0.\n  - If only\
    \ a single cluster is produced, try increasing `required_score`, adjusting the clustering parameter,\n\
    \    or switching to a physical network for a sparser interaction map."
- name: string_network_link
  description: 'Retrieves a stable URL to an interactive STRING network for one or more proteins.


    - For a single protein: includes the protein and its top 10 most likely interactors.

    - For multiple proteins: includes all known interactions **within the query set**.


    The input may include one numeric value per protein, such as fold change, effect size, or score.

    These values are visualized as colored halos around the nodes, allowing overlay of protein-level measurements
    on the network.


    Example:

    PTEN 2.1

    SMO -1.3


    If numeric values are provided:

    - positive values are shown in blue

    - negative values are shown in red

    - larger absolute values produce stronger halo intensity


    If the user provides numeric values together with the proteins, preserve them in the query.


    If few or no interactions are shown, consider lowering `required_score`.


    For large queries (>100 proteins):

    - use `network_flavor="confidence"`

    - increase `required_score` (e.g. 700)


    Always display the link as a markdown hyperlink (hide the raw URL).


    Input parameters should match those used in related STRING tools unless otherwise specified.'
- name: string_homology
  description: "Retrieves pairwise protein similarity scores (Smith–Waterman bit scores) for the query\
    \ proteins.  \n\n- If no target species (`species_b`) is provided, results are intra-species (within\
    \ the query species).  \n- To retrieve homologs in other species or clades (e.g. vertebrates, yeast,\
    \ plants), specify one or more NCBI taxon IDs in `species_b`.  \n- Multiple target species are supported;\
    \ ask the user to clarify if needed.  \n- Always report species names together with their taxon IDs.\
    \  \n- Bit scores < 50 are not reported.  \n- Results are truncated to the top 50 proteins per input\
    \ protein."
- name: string_interaction_evidence
  description: "Retrieves direct links to STRING evidence pages for protein–protein interaction pairs.\n\
    \nUse this tool only when a STRING evidence page/link is needed. To determine whether\nan interaction\
    \ is supported, use `string_interactions_query_set`.\n\nIt returns URLs linking to STRING’s evidence\
    \ pages, which display the underlying data sources \n(experimental results, publications, and curated\
    \ databases) supporting each predicted interaction.  \nA URL can be generated even for unsupported\
    \ pairs; the URL is not itself an interaction verdict.\nThe returned page lets the user explore functional,\
    \ physical, and regulatory relationship views through its tabs.\n\nParameters:\n- **identifier_a**:\
    \ Query protein identifier (Protein A)\n- **identifiers_b**: One or more target protein identifiers\
    \ (Protein B), separated by `%0d`\n- **species**: NCBI taxonomy ID (e.g. `9606` for human or `10090`\
    \ for mouse)\n- **network_type**: Set to `physical` for physical evidence or `regulatory` for directed\
    \ regulatory evidence.\n\nTypical user questions that should trigger this tool:\n- \"Can you show\
    \ me the STRING evidence for this interaction?\"\n- \"Show me the details supporting this interaction.\"\
    \n- \"What supports the interaction between TP53 and MDM2?\"\n- \"Where can I find the STRING evidence\
    \ for this pair?\""
- name: string_enrichment
  description: "This tool retrieves functional enrichment for a set of proteins using STRING.\n\n- If\
    \ queried with a single protein, the tool expands the query to include the protein’s 10 most likely\
    \ interactors; enrichment is performed on this set, not the original single protein.\n- For two or\
    \ more proteins, enrichment is performed on the exact input set.\n- When calling related tools, use\
    \ the same input parameters unless otherwise specified.\n- Focus summaries on the top categories and\
    \ most relevant terms for the results. Always report FDR for each claim.\n- Report FDR as a human-readable\
    \ value (e.g. 2.3e-5 or 0.023).\n- IMPORTANT: Remember to suggest showing an enrichment graph for\
    \ a specific category of user interest (e.g., GO, KEGG)\n- Very large responses are capped while preserving\
    \ category diversity.\n- Use `expand_category` to return only one category with expanded term coverage\
    \ and per-term gene details.\n- If a row has `preferredNames_omitted: true`, do not infer which proteins\
    \ are in that term from the returned rows.\n  Use `string_functional_annotation` with the same proteins/species\
    \ and `detail_for_term` set to the exact term ID.\n\nOutput fields (per enriched term):\n  - category:\
    \ Term category (e.g., GO Process, KEGG pathway)\n  - term: Enriched term (GO ID, domain, or pathway)\n\
    \  - number_of_genes: Number of input genes with this term\n  - number_of_genes_in_background: Number\
    \ of background genes with this term\n  - ncbiTaxonId: NCBI taxon ID\n  - preferredNames: Canonical\
    \ protein names, only when the full per-term list is short enough to show\n  - proteinCount: Number\
    \ of proteins matching this term\n  - preferredNames_omitted: True when the gene list was omitted\
    \ instead of showing a misleading partial list\n  - p_value: Raw p-value\n  - fdr: False Discovery\
    \ Rate (B-H corrected p-value)\n  - strength: Enrichment effect size, calculated as log10(observed\
    \ genes / expected genes)\n  - signal: Balanced enrichment-ranking metric combining the observed/expected\
    \ ratio and -log(FDR)\n  - description: Description of the enriched term\n\nResponse metadata:\n \
    \ - input_gene_name_mapping: Only included when displayed gene lists contain submitted identifiers\
    \ that differ\n    from STRING preferred names.\n  - category_summary: Total and returned term counts\
    \ per category; use `expand_category` for categories\n    where `truncated` is true or where the user\
    \ wants deeper category-specific detail.\n  - truncated_categories / omitted_categories: Categories\
    \ with terms not shown in the current response."
- name: string_functional_annotation
  description: "This tool retrieves curated functional annotations for a set of proteins.\n\nEach input\
    \ protein is mapped to known biological terms from ontologies, pathway databases, tissues, compartments\
    \ and domains — such as Gene Ontology (GO), KEGG, and UniProt Keywords.\n\n- Use this when the user\
    \ asks what a protein does, where it's localized, expressed, or which pathways it participates in.\n\
    - Keep the output short and focused by highlighting a few diverse and specific annotations for each\
    \ protein.\n- This tool does not perform statistical enrichment — use the enrichment tool for that.\n\
    \nOutput fields (per protein):\n  - stringId: STRING protein identifier\n  - preferredName: Gene name\
    \ or alias\n  - annotation: Functional description or keyword\n  - category: Source category (e.g.\
    \ GO, KEGG, Keyword)\n  - term: Functional term or ID"
- name: string_enrichment_image_url
  description: 'Retrieves a STRING enrichment figure (image URL) for a set of proteins. For the enriched
    terms and FDR values, use `string_enrichment`.


    - Each figure shows a single enrichment category; call again with another `category` to show a different
    one.

    - Use the same proteins and species as the network and enrichment results already shown to the user,
    so the figure matches them.'
- name: string_ppi_enrichment
  description: "This tool tests if your network is enriched in protein-protein interactions compared to\
    \ the background proteome-wide distribution (i.e., if your proteins are more functionally connected\
    \ than expected by chance).\n\n- The enrichment is assessed using the actual observed edges versus\
    \ expected edges in a random network of the same size.\n- The p-value reflects the likelihood that\
    \ your observed number of interactions would occur by chance.\n- Report the p-value as a human-readable\
    \ value (e.g. 2.3e-5 or 0.023).\n\nWhen calling related tools use the same input parameters unless\
    \ otherwise specified.\n\nOutput fields:\n  - number_of_nodes: Number of proteins in your network\n\
    \  - number_of_edges: Number of observed edges/interactions\n  - average_node_degree: Mean degree\
    \ (average number of interactions per node)\n  - local_clustering_coefficient: Average clustering\
    \ coefficient in the network\n  - expected_number_of_edges: Expected number of edges in a random network\
    \ of the same size\n  - p_value: p-value for network enrichment (smaller = more enriched)\n\nExample\
    \ identifiers: \"SMO%0dTP53\""
- name: string_proteins_for_term
  description: "Retrieve proteins annotated with a functional term or descriptive text in a single species.\
    \  \nYou can query for tissues, compartments, diseases, processes, pathways, and domains.  \n\nIMPORTANT:\
    \ For cross-species comparisons, run this tool separately for each species.  \nSelect relevant model\
    \ organisms to search or ask user to provide the selection.\nThe results reflect annotation depth\
    \ within each category; use caution when interpreting.\n\nIf no results are found, try simplifying\
    \ the query.  \nFor tissue queries, follow BRENDA tissue nomenclature and omit the word \"tissue\"\
    \  \n(e.g. use \"skin\" instead of \"skin tissue\").\n\nOutput fields:\n  - category: Source database\
    \ of the matched functional term\n              (e.g. GO, KEGG, Reactome, Pfam, InterPro).\n  - term:\
    \ Exact identifier for the functional term.\n  - description: The free text description of the term.\n\
    \  - proteinCount: Number of proteins annotated with that term\n  - preferredNames: Full protein-name\
    \ list when `detail_for_term` is set\n  - stringIds: STRING protein identifiers when returned\n  -\
    \ preferredNames_omitted: True when a row omits the protein-name list\n  - stringIds_omitted: True\
    \ when STRING identifiers are omitted"
- name: string_sequence_search
  description: 'Searches the STRING database using **amino acid sequences** to identify matching proteins.


    - Accepts a single sequence or multiple sequences in FASTA format.

    - Returns the most similar STRING protein(s) for the specified species, based on sequence similarity.

    - Use this when the protein identifier is unknown or unresolvable by `string_resolve_proteins`.'
- name: string_query_species
  description: "Search for species or clades available in STRING by free-text query\nand return their\
    \ NCBI taxonomy IDs.\n\n- Use this when the user asks which species or clades are present in STRING,\n\
    \  or when you need the correct NCBI taxon ID to pass to other tools.\n- use this to resolve NCBI\
    \ taxons IDs to their scientific names.\n- Accepts up to 100 taxon IDs separated by `%0d`.\n- The\
    \ results are limited to the top 50 matches per query.\n- When the user asks for a species list, do\
    \ not list clades.\n- If the requested species cannot be matched (i.e. the correct species is not\
    \ present\n  in the results), **immediately invoke the 'string_help' tool with topic='missing_species'**."
- name: string_create_file
  description: 'Creates a downloadable file for STRING-derived results.


    Use this tool when the user explicitly asks to download, save, export,

    or receive a file containing STRING data, tables, protein lists,

    enrichment results, networks, etc.


    When a response would otherwise include a publication-style or supplementary

    result table, or another table clearly intended for reuse outside chat,

    mention that a downloadable TSV/CSV file can be generated on request. Ask

    whether they want the file, unless they already requested it. Do not create

    the file until the user asks for it.


    Do not store unrelated data or full conversation transcripts.'
- name: string_help
  description: "Provides explanatory text for STRING features and limitations.\n\nUse this tool when the\
    \ user question involves:\n  - What is STRING is or how to use the tool (how_to_use_string, cytoscape)\n\
    \  - functionality not available via MCP tools (e.g. GSEA or large datasets).\n  - meaning of network\
    \ edges and their visual encoding (network_edge_legend)\n  - interpretation of enrichment strength\
    \ and signal (enrichment_scores)\n  - grouping of terms in enrichment figures (enrichment_grouping)"
